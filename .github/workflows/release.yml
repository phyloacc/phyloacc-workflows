name: Release

# Triggered by pushing a tag like v2.0.0. lib/info.yaml and CITATION.cff are
# bumped by hand and merged to main before tagging - see the "Releasing"
# section in README.md. The .githooks/pre-push hook (if activated - see
# README) is what guards against a tag/info.yaml mismatch, blocking the
# push locally before it ever reaches GitHub - this workflow just publishes.
#
# Tag pushes aren't affected by branch protection on main, so this always
# works regardless of how main is protected.
#
# If this repo is connected to Zenodo, the Release triggers an archive + DOI.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

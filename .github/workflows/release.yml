name: Release

# Triggered by pushing a tag like v2.0.0 - the version bump itself (lib/info.yaml,
# CITATION.cff) happens as a normal commit before tagging, not here, so the tagged
# commit already reflects the version being released.
#
# Release:
#   1. bump lib/info.yaml (version + releasedate-*) and CITATION.cff (version,
#      date-released), commit, push to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. this workflow turns that tag into a GitHub Release automatically
#   4. if this repo is connected to Zenodo, the Release triggers an archive + DOI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

# Canonical config template for the current workflow.
#
# This template covers the options used by:
# - Snakefile
# - workflow/phylofit_models.smk
# - workflow/phylop_regions.smk
# - workflow/phastcons_cnees.smk
#
# Fill in the paths and chromosome groups near the top first.
# Lower sections contain optional behavior controls and resource defaults.
#
##############################################################################
# Required project inputs - YOU MUST FILL THESE IN

###########################
# Primary workflow switches

run_phastcons: true
run_phylop: false

###########################
# Main pipeline inputs and outputs

maf:
# Absolute path to the input MAF alignment.

maf_ref_id:
# The species label of the reference genome in the MAF (the one whose coordinates the MAF is projected onto).

ref_gff:
# Absolute path to the GFF file of the reference genome in the MAF (set in 'maf_ref_id').

tree_file:
# Absolute path to the Newick formatted tree file for the species in the MAF.

ref_chromosome_groups:
  group1:
    - 
  group2:
    - 
# The names of the reference chromosomes to analyze.
# Grouping is organizational only - group names can be changed and added to and become subdirectories in the output.
# - List the CORE chromosome id, i.e. the id with BOTH the MAF prefix (maf_prefix) and
#   the GFF prefix (gff_prefix) removed. The MAF and GFF names are derived from it (see
#   maf_prefix / gff_prefix below). E.g. MAF "chr1", GFF "1" -> core "1", maf_prefix "chr".

output_dir:
# Absolute path to the desired output directory for this workflow.

tmp_dir:
# Absolute path to a directory for temporary files.

##############################################################################
# Align-only mode (ALTERNATIVE entry point)
# init-fork: align
#
# Set align_input_dir to a directory of UNALIGNED per-element FASTA files (one
# multi-FASTA per element, one record per species) to BYPASS the entire MAF-based
# prediction pipeline above and simply align each element with an aligner (mafft by
# default). Output is a directory of per-element aligned FASTAs + a manifest.txt
# (aligned elements) + a skipped.tsv (elements dropped, e.g. too few sequences or too
# short: tab-delimited columns locus, reason, n_seqs, max_len_bp). Leave align_input_dir
# BLANK to run the normal prediction pipeline. align_input_dir
# and maf are mutually exclusive (setting both is an error).

align_input_dir:
# Absolute path to a directory of unaligned per-element FASTA files. Blank = normal
# prediction pipeline (uses 'maf' above).

aligner: mafft
# Which aligner to run (must have a command template in aligner_commands below).

align_output_dir: ""
# Where aligned elements + manifest.txt are written. Blank -> <output_dir>/aligned-elements.

align_input_glob:
  - "*.fa"
  - "*.fasta"
  - "*.fna"
# Filename patterns picked up from align_input_dir.

align_batch_subdir_glob: "batch[0-9]*"
# Also search one level down in subdirectories matching this glob (e.g. the batchN dirs
# some CNEE extractors write, ~10k files each). Blank = flat top-level only. NOT recursive
# (only the top level and one level of matching subdirs are searched). A flat input dir
# works with either setting. The OUTPUT mirrors the input layout: a flat input dir gives
# flat output; batched input recreates the same batchN subdirs under aligned-elements/aligned/.

align_min_seqs: 2
# Elements with fewer sequences than this cannot be aligned and are skipped with a
# warning (never emitted as output). Raise to also drop sparse elements.

align_min_len_bp: 50
# Drop an element if its LONGEST ungapped record is shorter than this (bp). Default 50
# (matches cnee_min_len_bp); set 0 to align everything. Skipped -> skipped.tsv ("too-short").

align_header_split:
# If set, rewrite each ALIGNED record's header by splitting on this character and keeping
# one field (see align_header_field) - e.g. " " (space). Blank = keep headers as-is.

align_header_field: 0
# Which field of the split header to keep (0-based; negatives index from the end). E.g.
# align_header_split " " + align_header_field 0 turns ">gGal ce1 coords" into ">gGal".
# Out-of-range field for a given header -> that header is left unchanged.

align_batch_size: 2000
# Elements per SLURM job (scatter-gather); number of jobs = ceil(n_elements / this).

aligner_commands:
  mafft: ["mafft", "--auto", "{input}"]
# Per-aligner command templates. Tokens {input}/{output} are substituted per element;
# if a template contains {output} it is passed as an argument (muscle/prank style),
# otherwise the aligner's stdout is captured to the output file (mafft style). Add
# entries (e.g. muscle: ["muscle","-align","{input}","-output","{output}"]) to use
# other aligners without code changes.

##############################################################################
# Options below have been set with default values and MAY NOT NEED TO BE CHANGED

##############################################################################
# MAF / reference header settings

maf_prefix: ""
gff_prefix: ""
# The MAF and GFF may label chromosomes differently (e.g. MAF "chr1" vs GFF "1"). Both
# names are derived from the CORE id listed in ref_chromosome_groups:
#     maf_name = maf_prefix + core        gff_name = gff_prefix + core
# Set whichever side carries a prefix. Common case (MAF prefixed, GFF bare):
#     maf_prefix: "chr",  gff_prefix: ""   -> core "1" gives MAF "chr1", GFF "1"
# The other way (GFF prefixed, MAF bare):
#     maf_prefix: "",  gff_prefix: "chr"   -> core "1" gives MAF "1", GFF "chr1"
# All internal beds and alignment extraction use the MAF name; the GFF is read with the
# GFF name. (maf_chr_prefix is still accepted as a legacy alias for maf_prefix.)

maf_ref_chr_joiner: "."
# The character joining the reference ID and chromosome in the MAF src field (e.g. "Homo_sapiens.chr1").

# Examples:
# - MAF src field is "Mus_musculus.CM001010.3", GFF "CM001010.3"
# - maf_ref_id: "Mus_musculus"; maf_prefix: ""; gff_prefix: ""; maf_ref_chr_joiner: "."
#
# - MAF src field is "Homo_sapiens.chr1", GFF "1"
# - maf_ref_id: "Homo_sapiens"; maf_prefix: "chr"; gff_prefix: ""; maf_ref_chr_joiner: "."

##############################################################################
# Neutral model settings

filter_threshold_4d: 0.5
# Fraction of sequences allowed to be missing in a 4d site pattern.

use_gc_corrected_models: true
# Switch to enable/disable GC correction of phyloFit models.
# Setting 'false' removes the need for sample_file (a warning is printed, since
# results may be affected if the GC content of the 4d sites used to fit the neutral
# model differs from the genome-wide GC content).

sample_file:
# Absolute path to a CSV formatted sample sheet file.
# This file minimally must have one column named 'accession' with assembly accessions for GC content lookup.
# See 'accession_header' below to change the name of the column containing accessions.
# Alternatively, if a column called 'gc' is present, those values will be used instead of
# looking them up by accession.
# Only used if use_gc_corrected_models: true. If set, GC is looked up externally via
# these accessions. If left blank, GC is instead computed directly from the input MAF
# (via `mafutils gc`) - no sample sheet needed. Blank this to switch to MAF-based GC.

accession_header: accession
# Header in 'sample_file' containing assembly accessions for GC lookup.

##############################################################################
# phastCons behavior
# init-fork: phastcons
#
# phastCons calls conserved ELEMENTS directly from the neutral model. These options control
# how the reference is chunked for phastCons and the rho (expected-coverage) it uses.

##########
# Split strategy for phastCons

split_strategy: num_seqs
# One of:
# - num_seqs (default): split based on cross-species alignment coverage - runs of MAF
#   blocks with few aligned species are treated as gaps. Uses the MAF's own block index
#   (already produced by this pipeline), so it needs no reference FASTA/masking convention
#   and reflects what's actually alignable rather than an indirect proxy for it.
# - ns: split based on N-runs in the reference FASTA. Requires ref_fasta to be set and
#   Picard-recognized, and in practice a masked reference to be meaningful - on a
#   hard-masked genome this splits at every repeat, not just true assembly gaps, which can
#   produce very large numbers of tiny chunks.
# - fixed_windows: split into fixed-size windows regardless of alignment/reference content.

num_seqs_max_for_gap: 3
num_seqs_min_gap_bp: 100
num_seqs_min_keep_region_len: 6
# Used when split_strategy: num_seqs.
# num_seqs_max_for_gap: a MAF block with this many species or fewer counts toward a "gap" run.
# num_seqs_min_gap_bp: minimum contiguous length of a qualifying low-species-count run to
#   actually count as a split point - short dips don't fragment the chromosome.
# num_seqs_min_keep_region_len: drop resulting chunks shorter than this.
# These defaults are a starting point from exploratory analysis on one real alignment, not
# a tuned recommendation - review chunk count/size on your own data before trusting them.

#####

ref_fasta:
ref_fasta_index:  # Will be generated if not provided.
# Used when split_strategy: Ns or fixed_windows

min_Ns_to_split_by: 100
min_keep_region_len: 6
# Used when split_strategy: ns

#####

window_size_bp: 1000000
window_overlap_bp: 0
# Used when split_strategy: fixed_windows

##########

max_gap_pct: 0.9
# Maximum non-reference gap fraction allowed in chunk filtering.

rho_mode: fixed
# One of:
# - fixed
# - estimate

fixed_rho: 0.3
# Used when rho_mode: fixed

global_rho_stat: p90
# Used when rho_mode: estimate
# One of: p90, median, mean

##############################################################################
# CNEE behavior (shared across conservation sources)
#
# CNEE building (build_cnees: true; workflow/cnees.smk) is a shared stage: it turns
# conserved elements from ANY enabled conservation source into CNEEs (merge -> drop
# CDS-overlapping elements -> length-filter -> extract alignments). It runs for each
# active source and writes source-namespaced outputs:
#   <output_dir>/05-cnees/phastcons/...   (from phastCons conserved elements; run_phastcons)
#   <output_dir>/05-cnees/phylop/...      (from phyloP-clustered regions;      run_phylop)
# With both stages enabled you get both CNEE sets. The cnee_* options below apply to every
# source. (CDS coordinates and the per-chromosome MAF index are computed once and shared.)

cnee_output_format: fasta
# One of:
# - none
# - fasta
# - maf

cnee_ces_merge_gap_bp: 5
cnee_min_len_bp: 50
cnee_density_bin_bp: 1000000
# Bin width (bp) for the summary report's per-chromosome CNEE distribution plot -
# purely cosmetic, doesn't affect any CNEE calling/filtering.
cnee_fasta_header: species-coords-id
# Header mode is passed through to mafutils FASTA extraction.

cnee_fasta_dedupe: most-seq
# How a species appearing more than once in a block (paralogous / both-strand
# alignments) is collapsed by mafutils fetch. One of:
#   most-seq (default) - keep the copy with the most non-gap bases (one row per species,
#            PhyloAcc-ready).
#   none              - emit every copy; the downstream duplicate-species filter then
#            DROPS the whole CNEE if any species is duplicated. On deep alignments
#            (e.g. 241-way) this discards nearly every CNEE - use only for debugging.

cnee_expected_species: ""
# Optional comma-separated species list for FASTA extraction validation.
# If blank, species will be read from the tree file.

cnee_expected_species_file: ""
# Optional newline-delimited species list file.
# If blank, species will be read from the tree file.

##############################################################################
# phyloP-only behavior
# init-fork: phylop
#
# NOTE: per-site conserved calling has a hard statistical-power limit on shallow trees.
# The most-conserved possible site can only clear genome-wide FDR once the total neutral
# tree length is large (roughly > ~10 substitutions/site); below that, phyloP returns
# few/no conserved sites by construction (not a bug) while still returning accelerated
# ones. On shallow-tree datasets, prefer phastCons. See analyses/phylop-tree-length-power/
# for the full analysis.

phylop_alpha: 0.05
# FDR threshold (alpha) for calling a site conserved/accelerated, after Benjamini-Hochberg
# correction across all sites in the chromosome.

phylop_power_num_sites: estimate
# M (number of sites tested) for the FDR bar log10(M/alpha). One of:
# - estimate (default): the number of aligned/scored reference bases, summed from the MAF
#   block index for the chromosome. This equals the chromosome length for a whole-chromosome
#   MAF but correctly reports the smaller true count for a sliced MAF (where the chromosome's
#   srcSize would overcount). Falls back to MAF srcSize, then ref_fasta's .fai, then a constant.
# - a positive integer: use it directly as M for every chromosome.
# NOTE: deep-but-not-huge trees can sit right at the boundary; if the gate stops a tree you
# know is adequately deep, set phylop_power_override or adjust M here.

phylop_power_fallback_num_sites: 100000000
# M used by 'estimate' only if the block index, MAF srcSize, and ref_fasta/.fai are all unavailable.

##############################################################################
# Conserved site clustering behavior
# init-fork: phylop
# Conserved-region clustering (cluster_conserved_sites): how FDR-significant conserved
# sites are grouped into regions.

phylop_cluster_method: hmm
# One of:
# - hmm (default): a simple 2-state online HMM (in/out of a conserved element) over the
#   per-position conserved/not stream. Best agreement with phastCons elements in our
#   comparison (analyses/phylop-clustering-comparison), while staying simple and fast.
#   NOTE: it scans every position up to the last conserved site, so on whole chromosomes
#   it is O(chromosome length) - if it is slow on your data, raise this rule's time in
#   rule_resources.
# - gap_merge: merge significant sites that are close together, then length-filter (the
#   pipeline's original method).
# - windowed: fixed-size bins; bins with enough significant sites are conserved; merge
#   adjacent bins.

# hmm parameters (2-state HMM; defaults are from the phastCons-concordance tuning):
hmm_t0_0: 0.9      # P(stay outside a conserved element)
hmm_t1_1: 0.99     # P(stay inside a conserved element)  (higher -> longer elements)
hmm_e0_0: 0.8      # P(emit a non-conserved position | outside an element)
hmm_e1_1: 0.5      # P(emit a conserved site | inside an element)
hmm_s0: 0.9        # P(start outside an element)
hmm_min_len: 20    # drop predicted elements shorter than this (bp)
hmm_max_len: 100000  # drop predicted elements longer than this (bp)

# gap_merge parameters:
naive_merge_gap_bp: 20
naive_min_region_sites: 5
naive_min_region_len_bp: 20
# - naive_merge_gap_bp: merge significant sites no more than this far apart into one region.
# - naive_min_region_sites: drop regions with fewer than this many significant sites.
# - naive_min_region_len_bp: drop regions shorter than this.

# windowed parameters:
windowed_window_bp: 20
windowed_min_sites_per_window: 5
# - windowed_window_bp: bin size in bp.
# - windowed_min_sites_per_window: a bin is 'conserved' if it holds at least this many sites.

##############################################################################
# Resource defaults
#
# default resources based on a benchmark of a 15 species mammal alignment (Mus musculus
# reference). 
# Adjust these for your cluster.
#
# partition: set this to a valid Slurm partition name on your cluster before running.
#

rule_resources:
  default:
    partition:
    mem_mb: 4000
    cpus: 1
    time: 60

  # Rules that use the defaults:

  # workflow/phylofit_models.smk
  #   scales with genome size: ref_fasta_index, make_group_beds, ref_gff_split_by_chr,
  #     maf_index, maf_split_chr_by_group, extract_4d_codons_by_chr, extract_4d_sites,
  #     filter_4d_sites, run_phylofit, get_gc_content_from_maf (only used when
  #     sample_file is blank - reads the whole MAF once, like maf_index)
  #   scales with sample size: get_gc_content, maf_index, maf_split_chr_by_group,
  #     extract_4d_codons_by_chr, extract_4d_sites, filter_4d_sites, run_phylofit

  # workflow/phastcons_cnees.smk
  #   scales with genome size: ref_fasta_index, ref_fasta_dict, picard_scatter_by_ns,
  #     ns_to_bed, filter_ns_bed_minlen, ns_minlen_to_bed3, fixed_windows_bed,
  #     num_seqs_chunk_bed_chr (reads the per-chromosome block index once; only used
  #     when split_strategy: num_seqs - new, no benchmark data yet), maf_index_chr,
  #     maf_split_chunks, filter_maf_by_gap, global_rho, run_phastcons_chr,
  #     phastcons_concat_chr, extract_cds_bed_chr, cnees_from_conserved_chr,
  #     cnees_to_bed4_chr, cnee_alignments_chr
  #   scales with sample size: maf_index_chr, maf_split_chunks, filter_maf_by_gap,
  #     global_rho (only when rho_mode: estimate), run_phastcons_chr,
  #     cnee_alignments_chr

  # workflow/phylop_regions.smk
  #   scales with genome size: convert_wig_to_bed, adjust_pvals, get_conserved_sites,
  #     get_accelerated_sites, site_counts, cluster_conserved_sites, run_phylop
  #   scales with sample size: run_phylop

  # Snakefile
  #   scales with chromosome count only (reads small per-chromosome summary/manifest
  #     files already produced by other rules, not raw alignment content): summary_report

  maf_index:
    # Scales with genome size and sample size (indexes the whole MAF, all species).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  maf_split_chr_by_group:
    # Scales with genome size and sample size (splits a whole group's MAF, all species).
    partition:
    mem_mb: 8000
    cpus: 1
    time: 180

  extract_4d_codons_by_chr:
    # Scales with genome size and sample size (msa_view over the whole-chromosome
    # alignment, all species).
    partition:
    mem_mb: 8000
    cpus: 1
    time: 180

  get_gc_content_from_maf:
    # Scales with genome size and sample size (reads the whole MAF, all species).
    partition:
    mem_mb: 8000
    cpus: 4
    time: 90

  run_phylofit:
    # Scales with genome size and sample size (fits model on species x site matrix).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  run_phylop:
    # Scales with genome size and sample size (phyloP over the whole-chromosome
    # alignment, all species).
    partition:
    mem_mb: 8000
    cpus: 1
    time: 240

  adjust_pvals:
    # Scales with genome size only (processes already-computed p-values, not raw
    # alignment).
    partition:
    mem_mb: 6000
    cpus: 8
    time: 120

  picard_scatter_by_ns:
    # Scales with genome size only (scans the whole reference FASTA)
    partition:
    mem_mb: 8000
    cpus: 1
    time: 180

  maf_index_chr:
    # Scales with genome size and sample size (indexes a per-chromosome MAF, all species).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  maf_split_chunks:
    # Scales with genome size and sample size (extracts chunk MAF content, all species).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  filter_maf_by_gap:
    # Scales with genome size and sample size (reads every chunk's per-species rows
    # to compute gap fraction).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  global_rho:
    # Applies to rho_mode: estimate only (rho_mode: fixed explicitly uses `default)
    # Scales withgenome size and sample size (per-chunk phastCons --estimate-rho, all species).
    partition:
    mem_mb: 8000
    cpus: 8
    time: 480

  phastcons_per_chunk:
    # Used by rule run_phastcons_chr. Scales with genome size and sample size
    # (phastCons over chunk alignments, all species).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 180

  cnee_alignments_chr:
    # Scales with genome size and sample size (mafutils fetch per CNEE, all species).
    partition:
    mem_mb: 6000
    cpus: 4
    time: 120

  align_batch:
    # workflow/align_elements.smk (align-only mode). One job per batch of
    # align_batch_size elements; the aligner (mafft) runs over the batch's elements
    # in a thread pool (cpus = pool width). Scales with align_batch_size and element
    # size, not genome/sample size. (align_gather uses `default`.)
    partition:
    mem_mb: 4000
    cpus: 8
    time: 120

##############################################################################
##############################################################################
# Optional overrides

maf_split_chr_dir: ""
# Optional override for chromosome-split MAF directory.
# Default:
#   <output_dir>/01-maf-prep/maf-by-chromosome

phylofit_chr_dir: ""
# Optional override for chromosome-specific phyloFit model directory.
# Default:
#   <output_dir>/02-neutral-model/phylofit

target_ref_chromosomes: []
# Optional subset override.
# Leave [] to analyze all chromosomes listed in ref_chromosome_groups.
# Example: ["chr1", "chr2"]

##############################################################################
# Intermediate retention / debugging

debug_keep_intermediates: false
cleanup_chunk_intermediates: true
keep_cnee_sidecars: false

###########################
# Secondary workflow switches

run_phylofit: true
build_cnees: true

phylop_power_gate: true
# Master switch for the gate. false disables it entirely (phyloP always runs).

phylop_power_override: false
# true runs phyloP even when the gate fails (warns instead of stopping). Use if you
# understand you expect few/no per-site conserved calls but want to proceed anyway.

##############################################################################
# Rare meta/debug options

display: false
version: false
info: false
debug: false

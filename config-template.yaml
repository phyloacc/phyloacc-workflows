# Canonical config template for the current workflow.
#
# This template covers the options used by:
# - Snakefile
# - workflow/phylofit_models.smk
# - workflow/phylop_regions.smk
# - workflow/phastcons_cnees.smk
#
# Fill in the paths and chromosome groups near the top first.
# Lower sections contain optional behavior controls and resource defaults.
#
# Notes:
# - Use absolute paths.
# - ref_fasta_index must be exactly ref_fasta + ".fai".
# - Chromosome IDs in ref_chromosome_groups should match the IDs in the
#   reference FASTA index and reference GFF before maf_ref_id / prefix joining.

##############################################################################
# Required project inputs - YOU MUST FILL THESE IN

###########################
# Primary workflow switches

run_phylofit: true
run_phylop: true
run_phastcons: true
build_cnees: true

###########################
# Main pipeline inputs and outputs

output_dir:
# Absolute path to the desired output directory for this workflow.

tmp_dir: 
# Absolute path to a directory for temporary files.

sample_file:
# Absolute path to a CSV formatted sample sheet file.
# This file minimally must have one column named 'accession' with assembly accessions for GC content lookup.
# See 'accession_header' below to change the name of the column containing accessions.
# Alternatively, if a column called 'gc' is present, those values will be used instead of 
# looking them up by accession.

maf:
# Absolute path to the input MAF alignment.

tree_file:
# Absolute path to the Newick formatted tree file for the species in the MAF.

maf_ref_id:
# The species label of the reference genome in the MAF (the one whose coordinates the MAF is projected onto).

ref_fasta:
ref_fasta_index:
ref_gff:
# Absolute paths to the FASTA, FASTA index (.fai), and GFF file of the reference genome in the MAF (set in 'maf_ref_id').

ref_chromosome_groups:
  group1:
    - 
  group2:
    - 
# The names of the reference chromosomes to analyze.
# Grouping is organizational only - group names can be changed and added to and become subdirectories in the output.

##############################################################################
# Options below have been set with default values and MAY NOT NEED TO BE CHANGED

##############################################################################
# Secondary file settings

accession_header: accession
# Header in 'sample_file' containing assembly accessions for GC lookup.

maf_chr_prefix: ""
# If the chromsome IDs of the reference genome in the MAF are prefixed relative to those
# in the GFF, set that prefix here.
# E.g. if MAF chromosomes are labeled as "chr1" and GFF simply as "1", set maf_chr_prefix: "chr".

maf_ref_chr_joiner: "."
# The character joining the reference ID and chromosome in the MAF src field (e.g. "Homo_sapiens.chr1").

# Examples:
# - MAF src field is "Mus_musculus.CM001010.3"
# - maf_ref_id: "Mus_musculus"
# - maf_chr_prefix: ""
# - maf_ref_chr_joiner: "."
#
# Another example:
# - MAF src field is "Homo_sapiens.chr1"
# - maf_ref_id: "Homo_sapiens"
# - maf_chr_prefix: "chr"
# - maf_ref_chr_joiner: "."


##############################################################################
# Common analysis settings

filter_threshold_4d: 0.5
# Fraction of sequences allowed to be missing in a 4d site pattern.

use_gc_corrected_models: true
# Switch to enable/disable GC correction of phyloFit models.
# Setting 'false' removes the need for 'accession_header' column in the sample sheet.

phylop_alpha: 0.05
# FDR threshold for conserved site calling.

target_ref_chromosomes: []
# Optional subset override.
# Leave [] to analyze all chromosomes listed in ref_chromosome_groups.
# Example: ["chr1", "chr2"]

##############################################################################
# phyloP-only behavior

naive_merge_gap_bp: 20
naive_min_region_sites: 5
naive_min_region_len_bp: 20
# These control the naive phyloP conserved-region clustering step.

##############################################################################
# phastCons / CNEE behavior

split_strategy: ns
# One of:
# - ns
# - fixed_windows

min_Ns_to_split_by: 100
min_keep_region_len: 6
# Used when split_strategy: ns

window_size_bp: 1000000
window_overlap_bp: 0
# Used when split_strategy: fixed_windows

max_gap_pct: 0.9
# Maximum non-reference gap fraction allowed in chunk filtering.

rho_mode: fixed
# One of:
# - fixed
# - estimate

fixed_rho: 0.3
# Used when rho_mode: fixed

global_rho_stat: p90
# Used when rho_mode: estimate
# One of: p90, median, mean

cnee_output_format: fasta
# One of:
# - none
# - fasta
# - maf

cnee_ces_merge_gap_bp: 5
cnee_min_len_bp: 50
cnee_fasta_header: species-coords-id
# Header mode is passed through to mafutils FASTA extraction.

cnee_expected_species: ""
# Optional comma-separated species list for FASTA extraction validation.

cnee_expected_species_file: ""
# Optional newline-delimited species list file.

##############################################################################
# Optional path overrides

maf_split_chr_dir: ""
# Optional override for chromosome-split MAF directory.
# Default:
#   <output_dir>/01-maf-prep/maf-by-chromosome

phylofit_chr_dir: ""
# Optional override for chromosome-specific phyloFit model directory.
# Default:
#   <output_dir>/02-neutral-model/phylofit

##############################################################################
# Intermediate retention / debugging

debug_keep_intermediates: false
cleanup_chunk_intermediates: true
keep_cnee_sidecars: false

##############################################################################
# Rare meta/debug options

display: false
version: false
info: false
debug: false


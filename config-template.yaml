# Canonical config template for the current workflow.
#
# This template covers the options used by:
# - Snakefile
# - workflow/phylofit_models.smk
# - workflow/phylop_regions.smk
# - workflow/phastcons_cnees.smk
#
# Fill in the paths and chromosome groups near the top first.
# Lower sections contain optional behavior controls and resource defaults.
#
##############################################################################
# Required project inputs - YOU MUST FILL THESE IN

###########################
# Main pipeline inputs and outputs

maf:
# Absolute path to the input MAF alignment.

maf_ref_id:
# The species label of the reference genome in the MAF (the one whose coordinates the MAF is projected onto).

ref_fasta:
ref_fasta_index:  # Will be generated if not provided.
ref_gff:
# Absolute paths to the FASTA, FASTA index (.fai), and GFF file of the reference genome in the MAF (set in 'maf_ref_id').

tree_file:
# Absolute path to the Newick formatted tree file for the species in the MAF.

ref_chromosome_groups:
  group1:
    - 
  group2:
    - 
# The names of the reference chromosomes to analyze.
# Grouping is organizational only - group names can be changed and added to and become subdirectories in the output.
# - Chromosome IDs in ref_chromosome_groups should match the IDs in the
#   reference FASTA and reference GFF before maf_ref_id / prefix joining.

output_dir:
# Absolute path to the desired output directory for this workflow.

tmp_dir: 
# Absolute path to a directory for temporary files.

##############################################################################
# Options below have been set with default values and MAY NOT NEED TO BE CHANGED

##############################################################################
# Secondary file settings

accession_header: accession
# Header in 'sample_file' containing assembly accessions for GC lookup.

maf_chr_prefix: ""
# If the chromsome IDs of the reference genome in the MAF are prefixed relative to those
# in the GFF, set that prefix here.
# E.g. if MAF chromosomes are labeled as "chr1" and GFF simply as "1", set maf_chr_prefix: "chr".

maf_ref_chr_joiner: "."
# The character joining the reference ID and chromosome in the MAF src field (e.g. "Homo_sapiens.chr1").

# Examples:
# - MAF src field is "Mus_musculus.CM001010.3"
# - maf_ref_id: "Mus_musculus"
# - maf_chr_prefix: ""
# - maf_ref_chr_joiner: "."
#
# Another example:
# - MAF src field is "Homo_sapiens.chr1"
# - maf_ref_id: "Homo_sapiens"
# - maf_chr_prefix: "chr"
# - maf_ref_chr_joiner: "."

##############################################################################
# Neutral model settings

filter_threshold_4d: 0.5
# Fraction of sequences allowed to be missing in a 4d site pattern.

use_gc_corrected_models: false
# Switch to enable/disable GC correction of phyloFit models.
# Setting 'false' removes the need for sample_file (a warning is printed, since
# results may be affected if the GC content of the 4d sites used to fit the neutral
# model differs from the genome-wide GC content).

sample_file:
# Absolute path to a CSV formatted sample sheet file.
# This file minimally must have one column named 'accession' with assembly accessions for GC content lookup.
# See 'accession_header' below to change the name of the column containing accessions.
# Alternatively, if a column called 'gc' is present, those values will be used instead of
# looking them up by accession.
# Required if use_gc_corrected_models: true (errors informatively if blank); unused
# and optional if use_gc_corrected_models: false.

##############################################################################
# phastCons / CNEE behavior

split_strategy: ns
# One of:
# - ns
# - fixed_windows

min_Ns_to_split_by: 100
min_keep_region_len: 6
# Used when split_strategy: ns

window_size_bp: 1000000
window_overlap_bp: 0
# Used when split_strategy: fixed_windows

max_gap_pct: 0.9
# Maximum non-reference gap fraction allowed in chunk filtering.

rho_mode: fixed
# One of:
# - fixed
# - estimate

fixed_rho: 0.3
# Used when rho_mode: fixed

global_rho_stat: p90
# Used when rho_mode: estimate
# One of: p90, median, mean

cnee_output_format: fasta
# One of:
# - none
# - fasta
# - maf

cnee_ces_merge_gap_bp: 5
cnee_min_len_bp: 50
cnee_fasta_header: species-coords-id
# Header mode is passed through to mafutils FASTA extraction.

cnee_expected_species: ""
# Optional comma-separated species list for FASTA extraction validation.
# If blank, species will be read from the tree file.

cnee_expected_species_file: ""
# Optional newline-delimited species list file.
# If blank, species will be read from the tree file.

##############################################################################
# phyloP-only behavior

phylop_alpha: 0.05
# FDR threshold for conserved site calling.

naive_merge_gap_bp: 20
naive_min_region_sites: 5
naive_min_region_len_bp: 20
# These control the naive phyloP conserved-region clustering step.

##############################################################################
# Resource defaults
#
# default resources based on a benchmark of a 15 species mammal alignment (Mus musculus
# reference). 
# Adjust these for your cluster.
#
# partition: set this to a valid Slurm partition name on your cluster before running.
#

rule_resources:
  default:
    partition:
    mem_mb: 4000
    cpus: 1
    time: 60

  # Rules that use the defaults:

  # workflow/phylofit_models.smk
  #   scales with genome size: ref_fasta_index, make_group_beds, ref_gff_split_by_chr,
  #     maf_index, maf_split_chr_by_group, extract_4d_codons_by_chr, extract_4d_sites,
  #     filter_4d_sites, run_phylofit
  #   scales with sample size: get_gc_content, maf_index, maf_split_chr_by_group,
  #     extract_4d_codons_by_chr, extract_4d_sites, filter_4d_sites, run_phylofit

  # workflow/phastcons_cnees.smk
  #   scales with genome size: ref_fasta_index, ref_fasta_dict, picard_scatter_by_ns,
  #     ns_to_bed, filter_ns_bed_minlen, ns_minlen_to_bed3, fixed_windows_bed,
  #     maf_index_chr, maf_split_chunks, filter_maf_by_gap, global_rho,
  #     run_phastcons_chr, phastcons_concat_chr, extract_cds_bed_chr,
  #     cnees_from_conserved_chr, cnees_to_bed4_chr, cnee_alignments_chr
  #   scales with sample size: maf_index_chr, maf_split_chunks, filter_maf_by_gap,
  #     global_rho (only when rho_mode: estimate), run_phastcons_chr,
  #     cnee_alignments_chr

  # workflow/phylop_regions.smk
  #   scales with genome size: convert_wig_to_bed, adjust_pvals, get_conserved_sites,
  #     get_accelerated_sites, site_counts, naive_cluster_conserved_sites, run_phylop
  #   scales with sample size: run_phylop

  maf_index:
    # Scales with genome size and sample size (indexes the whole MAF, all species).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  maf_split_chr_by_group:
    # Scales with genome size and sample size (splits a whole group's MAF, all species).
    partition:
    mem_mb: 8000
    cpus: 1
    time: 180

  extract_4d_codons_by_chr:
    # Scales with genome size and sample size (msa_view over the whole-chromosome
    # alignment, all species).
    partition:
    mem_mb: 8000
    cpus: 1
    time: 180

  run_phylofit:
    # Scales with genome size and sample size (fits model on species x site matrix).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  run_phylop:
    # Scales with genome size and sample size (phyloP over the whole-chromosome
    # alignment, all species).
    partition:
    mem_mb: 8000
    cpus: 1
    time: 240

  adjust_pvals:
    # Scales with genome size only (processes already-computed p-values, not raw
    # alignment).
    partition:
    mem_mb: 6000
    cpus: 8
    time: 120

  picard_scatter_by_ns:
    # Scales with genome size only (scans the whole reference FASTA)
    partition:
    mem_mb: 8000
    cpus: 1
    time: 180

  maf_index_chr:
    # Scales with genome size and sample size (indexes a per-chromosome MAF, all species).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  maf_split_chunks:
    # Scales with genome size and sample size (extracts chunk MAF content, all species).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  filter_maf_by_gap:
    # Scales with genome size and sample size (reads every chunk's per-species rows
    # to compute gap fraction).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 120

  global_rho:
    # Applies to rho_mode: estimate only (rho_mode: fixed explicitly uses `default)
    # Scales withgenome size and sample size (per-chunk phastCons --estimate-rho, all species).
    partition:
    mem_mb: 8000
    cpus: 8
    time: 480

  phastcons_per_chunk:
    # Used by rule run_phastcons_chr. Scales with genome size and sample size
    # (phastCons over chunk alignments, all species).
    partition:
    mem_mb: 6000
    cpus: 1
    time: 180

  cnee_alignments_chr:
    # Scales with genome size and sample size (mafutils fetch per CNEE, all species).
    partition:
    mem_mb: 6000
    cpus: 4
    time: 120

##############################################################################
##############################################################################
# Optional overrides

maf_split_chr_dir: ""
# Optional override for chromosome-split MAF directory.
# Default:
#   <output_dir>/01-maf-prep/maf-by-chromosome

phylofit_chr_dir: ""
# Optional override for chromosome-specific phyloFit model directory.
# Default:
#   <output_dir>/02-neutral-model/phylofit

target_ref_chromosomes: []
# Optional subset override.
# Leave [] to analyze all chromosomes listed in ref_chromosome_groups.
# Example: ["chr1", "chr2"]

##############################################################################
# Intermediate retention / debugging

debug_keep_intermediates: false
cleanup_chunk_intermediates: true
keep_cnee_sidecars: false

###########################
# Primary workflow switches

run_phylofit: true
run_phylop: true
run_phastcons: true
build_cnees: true

##############################################################################
# Rare meta/debug options

display: false
version: false
info: false
debug: false



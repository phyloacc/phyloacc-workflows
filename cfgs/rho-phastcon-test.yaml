# The main output directory for the workflow

tmp_dir: /n/holylfs05/LABS/informatics/Lab/projects/asaha/tmp
# A directory for some temporary files - should have lots of space


maf_split_by_chromosome: /n/holylfs05/LABS/informatics/Lab/projects/asaha/phyloacc-workflows-dev/summary-data/B_mori_only_Bombycoidea/mafs

maf_ref_id: "bombyx_mori"
maf_chr_prefix: ""
maf_ref_chr_joiner: "."
# The chromosome IDs in the split gffs must match those in the maf
# In case the chromosomes are labeled differently in the gff and the maf, use the maf_ref_chr_joiner and maf_chr_prefix
# Chromosome IDs in the split gffs will be maf_ref_id + maf_ref_chr_joiner + maf_chr_prefix
# If the chromosomes are labeled the same, just set maf_chr_prefix to an empty string, ""

tree_file: /n/holylfs05/LABS/informatics/Lab/projects/asaha/phyloacc-workflows-dev/data/tree/bombyx_neighbors12_subtree.tre
# The species tree in Newick format

ref_gff: /n/holylfs05/LABS/informatics/Lab/projects/asaha/phyloacc-workflows-dev/data/gff/GCF_030269925.1_ASM3026992v2_genomic.gff
# The GFF annotation of the reference genome in the MAF

make_cnees: true
#(false, if not needed) If true, create 06-CNEES/{group}/{chrom}.cnees.bed by subtracting CDS intervals from
# 04-conserved/{group}/{chrom}.phastcon-conserved.bed.

make_cnee_mafs: true
# (false, if not needed) If true, create 07-CNEE_mafs/{group}/{chrom}/ with one MAF per CNEE and a manifest.txt.

cnee_ces_merge_gap_bp: 5
# Merge conserved-element intervals within this bp gap before CDS subtraction to make CNEEs.

cnee_min_len_bp: 50
# Keep only CNEEs with length > cnee_min_len_bp before generating CNE MAFs.

cne_extract_format: fasta
# Output format for CNE extraction from maf_fetch.py: fasta or maf.

cne_fasta_header: species-coords-id
# FASTA header mode passed to maf_fetch.py when cne_extract_format: fasta.

ref_fasta: /n/holylfs05/LABS/informatics/Lab/projects/asaha/phyloacc-workflows-dev/data/assembly/Bombyx_mori_gca030269925v1rs.ASM3026992v2.dna_rm.toplevel.fa
# hardmasked genome fasta (usually available in ENCODE)

Phylofit_per_chromosome: /n/holylfs05/LABS/informatics/Lab/projects/asaha/phyloacc-workflows-dev/summary-data/B_mori_only_Bombycoidea/03-phylofit

min_Ns_to_split_by: 100

min_cluster_sizes: [20, 35, 50]
min_samples: [1, 10, 25, 50, 75]

